<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oluwafemi Johnson | Full Stack Software Engineer</title>

    <!-- Preconnect speeds up the font fetch, part of keeping first load fast -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />


    <!-- Preload starts the portrait download immediately, in parallel with the javascript bundle
         instead of waiting for react to render before the browser even knows this image exists
         media query means mobile only preloads the smaller mobile file, not both -->
    <link rel="preload" as="image" href="/images/portrait.png" media="(min-width: 768px)" />
  </head>
  <body class="bg-background">
    <div id="root"></div>

    <!-- Fires the wake up request immediately, before the react bundle even finishes downloading
         this is the earliest possible moment we can start waking the server, giving it a head start
         while the rest of the page is still loading -->
    <script>
      fetch("https://my-portfolioapi-sist.onrender.com/api/health").catch(() => {})
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
