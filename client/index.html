    <!-- Preload starts the portrait download immediately, in parallel with the javascript bundle
         instead of waiting for react to render before the browser even knows this image exists
         media query means mobile only preloads the smaller mobile file, not both -->
    <link rel="preload" as="image" href="/images/portrait.png" media="(min-width: 768px)" />
